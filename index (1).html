<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হগলতান – খাবার ও মুদি ডেলিভারি</title>
<style>
:root{--pink:#d70f64;--pink2:#b50c54;--bg:#f6f6f7;--card:#fff;--tx:#2e2e2e;--mut:#6b6b6b;--ln:#e6e6e8;--ok:#2e9d4f}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d20;--tx:#f1f1f1;--mut:#a0a0a6;--ln:#33333a}}
*{box-sizing:border-box;margin:0}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
button{font:inherit;cursor:pointer;border:0}
header{background:var(--pink);color:#fff;position:sticky;top:0;z-index:20}
.bar{max-width:1100px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{font-weight:700;font-size:22px}
.sp{flex:1}
.pill{background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:6px 14px}
.cartbtn{background:#fff;color:var(--pink);font-weight:700;border-radius:20px;padding:6px 14px}
.hero{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;padding:26px 14px 34px}
.hero div{max-width:1100px;margin:auto}
.hero h1{font-size:28px;margin-bottom:6px}
.search{margin-top:14px;display:flex;background:#fff;border-radius:10px;overflow:hidden;max-width:560px}
.search input{flex:1;border:0;padding:12px 14px;font:inherit;outline:0;color:#222}
main{max-width:1100px;margin:auto;padding:14px}
.tabs{display:flex;gap:8px;margin:6px 0 14px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--ln);white-space:nowrap}
.tab.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.rc{cursor:pointer}
.rc .img{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#ffe3ef,#fff1c9)}
.rc.closed{opacity:.55}
.rc .b{padding:10px 12px}
.rc h3{font-size:17px}
.m{color:var(--mut);font-size:13px;margin-top:4px}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#ffe3ef;color:var(--pink);margin-top:6px}
.tag.x{background:#eee;color:#666}
.item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.em{font-size:34px;width:48px;text-align:center}
.item .i{flex:1}
.add{background:var(--pink);color:#fff;border-radius:8px;padding:6px 14px}
.add:disabled{background:#999}
.back{background:none;color:var(--pink);padding:4px 0;margin-bottom:8px;font-weight:600}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--ln);color:var(--tx)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40;justify-content:flex-end}
.drawer.on{display:flex}
.panel{background:var(--card);width:min(420px,100%);height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:8px}
.panel input,.panel textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.big{background:var(--pink);color:#fff;border-radius:10px;padding:12px;font-weight:700;width:100%}
.big:disabled{background:#999}
.err{color:#d00;font-size:14px}
.ok{text-align:center;padding:30px 10px}
.ok .e{font-size:60px}
.steps{display:flex;justify-content:space-between;margin:14px 0;font-size:12px;color:var(--mut)}
.steps span.on{color:var(--ok);font-weight:700}
.fab{position:fixed;bottom:0;left:0;right:0;background:var(--pink);color:#fff;padding:14px;display:none;justify-content:space-between;z-index:30;font-weight:700}
.fab.on{display:flex}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo">🛵 হগলতান</span><span class="sp"></span>
  <button class="pill" id="lang">English</button>
  <button class="cartbtn" id="cartbtn"></button>
</div></header>
<section class="hero"><div>
  <h1 id="h1"></h1><p id="sub"></p>
  <div class="search"><input id="q"></div>
</div></section>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<button class="fab" id="fab"></button>
<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div>
<footer id="foot"></footer>

<script>
const SB="https://zphbqwkvsacptggytbmr.supabase.co";
const KEY="sb_publishable_i6_Cye57ryc5jSzHdmem-A_7WDig9Zd";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const T={
 bn:{h1:"ক্ষুধা লাগলে, হগলতান",sub:"রেস্তোরাঁর খাবার ও তাজা বাজার, দরজায় নগদ টাকায় নিন (ক্যাশ অন ডেলিভারি)",ph:"রেস্তোরাঁ, খাবার বা পণ্য খুঁজুন…",rest:"রেস্তোরাঁ",groc:"মুদি বাজার",all:"সব",veg:"সবজি",fruit:"ফল",stap:"মুদি",dairy:"দুধ-ডিম",open:"খোলা",closed:"বন্ধ",min:"ন্যূনতম",fee:"ডেলিভারি",add:"যোগ করুন",cart:"কার্ট",back:"← ফিরে যান",empty:"কার্ট খালি",sub_t:"সাবটোটাল",del:"ডেলিভারি চার্জ",tot:"মোট",name:"আপনার নাম",phone:"ফোন (০১XXXXXXXXX)",addr:"পূর্ণ ঠিকানা",memo:"নোট (ঐচ্ছিক)",place:"অর্ডার করুন",placing:"পাঠানো হচ্ছে…",done:"অর্ডার পাঠানো হয়েছে!",ono:"অর্ডার নম্বর",cod:"রাইডারকে নগদ টাকা দিন।",new:"নতুন",confirmed:"নিশ্চিত",preparing:"তৈরি হচ্ছে",on_the_way:"পথে",delivered:"পৌঁছেছে",close:"বন্ধ করুন",bad:"নাম, সঠিক ফোন ও ঠিকানা দিন",minerr:"ন্যূনতম অর্ডার ",oneRest:"এক সময়ে এক রেস্তোরাঁ থেকে অর্ডার করা যায়। নতুন কার্ট শুরু করবেন?",fail:"অর্ডার পাঠানো যায়নি, আবার চেষ্টা করুন",load:"লোড হচ্ছে…",none:"কিছু পাওয়া যায়নি",view:"কার্ট দেখুন",foot:"© হগলতান · তাজা বাজার ও খাবার, ঘরে বসে",min_:"মিনিট",groceryLabel:"মুদি"},
 en:{h1:"Hungry? Hogoltan.",sub:"Restaurant food and fresh groceries, pay cash at your door (cash on delivery)",ph:"Search restaurants, dishes or items…",rest:"Restaurants",groc:"Grocery",all:"All",veg:"Veg",fruit:"Fruit",stap:"Staples",dairy:"Dairy & eggs",open:"Open",closed:"Closed",min:"Min",fee:"Delivery",add:"Add",cart:"Cart",back:"← Back",empty:"Your cart is empty",sub_t:"Subtotal",del:"Delivery fee",tot:"Total",name:"Your name",phone:"Phone (01XXXXXXXXX)",addr:"Full address",memo:"Note (optional)",place:"Place order",placing:"Sending…",done:"Order placed!",ono:"Order no.",cod:"Pay cash to the rider.",new:"New",confirmed:"Confirmed",preparing:"Preparing",on_the_way:"On the way",delivered:"Delivered",close:"Close",bad:"Enter name, a valid phone and address",minerr:"Minimum order ",oneRest:"You can order from one restaurant at a time. Start a new cart?",fail:"Could not place order, try again",load:"Loading…",none:"Nothing found",view:"View cart",foot:"© Hogoltan · fresh groceries & food, at home",min_:"min",groceryLabel:"Grocery"}
};
const GROC_FEE=40;
let L=localStorage.getItem("lang")||"bn", t=k=>T[L][k];
let S={tab:"rest",cat:"all",rid:null,q:"",R:[],P:[],cart:{},cartRest:null,loading:true};
try{const c=JSON.parse(localStorage.getItem("cart")||"null");if(c){S.cart=c.cart||{};S.cartRest=c.cartRest??null}}catch(e){}
const $=id=>document.getElementById(id);
const n=x=>Number(x).toLocaleString(L==="bn"?"bn-BD":"en-US");
const tk=x=>"৳"+n(x);
const nm=(o,k="name")=>L==="en"&&o[k+"_en"]?o[k+"_en"]:o[k+"_bn"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{try{localStorage.setItem("cart",JSON.stringify({cart:S.cart,cartRest:S.cartRest}))}catch(e){}};
const em=e=>e==="🫘"?"🍲":(e||"🛒");

async function load(){
  try{
    const [r,p]=await Promise.all([
      fetch(SB+"/rest/v1/restaurants?select=*,menu_items(*)&order=id",{headers:H}).then(x=>x.json()),
      fetch(SB+"/rest/v1/products?select=*&order=id",{headers:H}).then(x=>x.json())
    ]);
    S.R=Array.isArray(r)?r:[];
    const seen={};
    (Array.isArray(p)?p:[]).forEach(x=>{const k=x.name_bn+"|"+x.unit_bn;if(!seen[k])seen[k]=x});
    S.P=Object.values(seen);
  }catch(e){}
  S.loading=false;render();
}

function render(){
  document.documentElement.lang=L;
  $("lang").textContent=L==="bn"?"English":"বাংলা";
  $("h1").textContent=t("h1");$("sub").textContent=t("sub");$("q").placeholder=t("ph");$("foot").textContent=t("foot");
  $("tabs").innerHTML=[["rest","rest"],["groc","groc"]].map(([k,l])=>`<button class="tab ${S.tab===k&&!S.rid?"on":""}" data-t="${k}">${t(l)}</button>`).join("");
  const cnt=Object.values(S.cart).reduce((a,b)=>a+b.q,0);
  $("cartbtn").textContent=t("cart")+" ("+n(cnt)+")";
  const f=$("fab");f.classList.toggle("on",cnt>0);f.textContent="";
  if(cnt){f.innerHTML=`<span>${t("view")} · ${n(cnt)}</span><span>${tk(sub())}</span>`}
  const v=$("view");
  if(S.loading){v.innerHTML=`<p>${t("load")}</p>`;return}
  const q=S.q.toLowerCase();
  if(S.rid){
    const r=S.R.find(x=>x.id===S.rid);if(!r){S.rid=null;return render()}
    v.innerHTML=`<button class="back" data-back>${t("back")}</button>
    <div class="card" style="padding:14px;margin-bottom:12px"><h2>${esc(nm(r,"name"))}</h2>
    <div class="m">${esc(r.cuisine||"")} · ${esc(r.area||"")} · ${n(r.prep_time_min||0)} ${t("min_")}</div>
    <div class="m">${t("fee")} ${tk(r.delivery_fee)} · ${t("min")} ${tk(r.min_order)}</div>
    <span class="tag ${r.is_open?"":"x"}">${r.is_open?t("open"):t("closed")}</span></div>
    <div class="card">${(r.menu_items||[]).filter(m=>m.in_stock).map(m=>`<div class="item"><div class="em">${em(m.emoji)}</div><div class="i"><b>${esc(nm(m))}</b><div class="m">${esc(m.description_bn||"")}</div><div><b>${tk(m.price)}</b></div></div><button class="add" data-add="m${m.id}" ${r.is_open?"":"disabled"}>${t("add")}</button></div>`).join("")}</div>`;
    return;
  }
  if(S.tab==="rest"){
    const list=S.R.filter(r=>!q||(r.name_bn+" "+(r.cuisine||"")+" "+(r.area||"")+" "+(r.menu_items||[]).map(m=>m.name_bn).join(" ")).toLowerCase().includes(q));
    v.innerHTML=list.length?`<div class="grid">${list.map(r=>`<div class="card rc ${r.is_open?"":"closed"}" data-r="${r.id}"><div class="img">${em((r.menu_items||[])[0]?.emoji)}</div><div class="b"><h3>${esc(nm(r,"name"))}</h3><div class="m">${esc(r.cuisine||"")} · ${esc(r.area||"")}</div><div class="m">⏱ ${n(r.prep_time_min||0)} ${t("min_")} · ${t("fee")} ${tk(r.delivery_fee)}</div><span class="tag ${r.is_open?"":"x"}">${r.is_open?t("open"):t("closed")}</span></div></div>`).join("")}</div>`:`<p>${t("none")}</p>`;
  }else{
    const cats=["all","veg","fruit","stap","dairy"];
    const list=S.P.filter(p=>p.in_stock&&(S.cat==="all"||p.category===S.cat)&&(!q||(p.name_bn+" "+(p.name_en||"")).toLowerCase().includes(q)));
    v.innerHTML=`<div class="tabs">${cats.map(c=>`<button class="tab ${S.cat===c?"on":""}" data-c="${c}">${t(c)}</button>`).join("")}</div>
    <div class="grid">${list.map(p=>`<div class="card" style="padding:12px"><div style="font-size:40px">${em(p.emoji)}</div><b>${esc(nm(p))}</b><div class="m">${esc(p.unit_bn||"")}</div><div class="row" style="margin-top:8px;align-items:center"><b>${tk(p.price)}</b><button class="add" data-add="p${p.id}">${t("add")}</button></div></div>`).join("")}</div>${list.length?"":`<p>${t("none")}</p>`}`;
  }
}

function find(key){
  if(key[0]==="m"){for(const r of S.R){const m=(r.menu_items||[]).find(x=>"m"+x.id===key);if(m)return{key,name:nm(m),price:+m.price,e:em(m.emoji),rest:r.id}}}
  else{const p=S.P.find(x=>"p"+x.id===key);if(p)return{key,name:nm(p)+" ("+(p.unit_bn||"")+")",price:+p.price,e:em(p.emoji),rest:null}}
}
function addItem(key){
  const it=find(key);if(!it)return;
  if(Object.keys(S.cart).length&&S.cartRest!==it.rest){
    if(!confirm(t("oneRest")))return;S.cart={};
  }
  S.cartRest=it.rest;
  S.cart[key]=S.cart[key]?{...S.cart[key],q:S.cart[key].q+1}:{...it,q:1};
  save();render();
}
const sub=()=>Object.values(S.cart).reduce((a,b)=>a+b.price*b.q,0);
const fee=()=>{if(!Object.keys(S.cart).length)return 0;if(S.cartRest===null)return GROC_FEE;const r=S.R.find(x=>x.id===S.cartRest);return r?+r.delivery_fee:0};
const minOrder=()=>{const r=S.R.find(x=>x.id===S.cartRest);return r?+r.min_order:0};

function openCart(msg){
  const p=$("panel"),items=Object.values(S.cart);
  p.innerHTML=`<div class="row"><h2>${t("cart")}</h2><button data-close class="pill" style="color:var(--tx);background:var(--ln)">✕</button></div>`+
  (items.length?`${items.map(i=>`<div class="row" style="align-items:center"><span>${i.e} ${esc(i.name)}<div class="m">${tk(i.price)}</div></span><span class="qty"><button data-q="${i.key}" data-d="-1">−</button>${n(i.q)}<button data-q="${i.key}" data-d="1">+</button></span></div>`).join("")}
  <hr style="border:0;border-top:1px solid var(--ln)">
  <div class="row"><span>${t("sub_t")}</span><b>${tk(sub())}</b></div>
  <div class="row"><span>${t("del")}</span><b>${tk(fee())}</b></div>
  <div class="row"><span>${t("tot")}</span><b>${tk(sub()+fee())}</b></div>
  <input id="f_name" placeholder="${t("name")}" maxlength="100"><input id="f_phone" placeholder="${t("phone")}" maxlength="20" inputmode="tel"><textarea id="f_addr" rows="2" placeholder="${t("addr")}" maxlength="300"></textarea><input id="f_memo" placeholder="${t("memo")}" maxlength="200">
  <div class="err" id="err">${msg||""}</div>
  <button class="big" id="place">${t("place")} · ${tk(sub()+fee())}</button>`:`<p>${t("empty")}</p>`);
  $("drawer").classList.add("on");
}

async function placeOrder(){
  const name=$("f_name").value.trim(),phone=$("f_phone").value.trim(),addr=$("f_addr").value.trim(),memo=$("f_memo").value.trim();
  const e=$("err");
  if(!name||!addr||!/^(\+?88)?01\d{9}$/.test(phone.replace(/[\s-]/g,""))){e.textContent=t("bad");return}
  if(S.cartRest!==null&&sub()<minOrder()){e.textContent=t("minerr")+tk(minOrder());return}
  const b=$("place");b.disabled=true;b.textContent=t("placing");
  const no="HG"+Date.now().toString(36).toUpperCase().slice(-6);
  const body={order_no:no,name,phone,address:addr,memo:memo||null,
    items:Object.values(S.cart).map(i=>({name:i.name,price:i.price,qty:i.q})),
    subtotal:sub(),delivery:fee(),total:sub()+fee(),status:"new",restaurant_id:S.cartRest,rider_id:null};
  try{
    const r=await fetch(SB+"/rest/v1/orders",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok)throw 0;
    S.cart={};S.cartRest=null;save();render();
    const st=["new","confirmed","preparing","on_the_way","delivered"];
    $("panel").innerHTML=`<div class="ok"><div class="e">✅</div><h2>${t("done")}</h2><p>${t("ono")}: <b>${no}</b></p><p class="m">${t("cod")}</p>
    <div class="steps">${st.map((s,i)=>`<span class="${i===0?"on":""}">${t(s)}</span>`).join("")}</div>
    <button class="big" data-close>${t("close")}</button></div>`;
  }catch(x){b.disabled=false;b.textContent=t("place");e.textContent=t("fail")}
}

document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);
  let el;
  if(el=g("[data-t]")){S.tab=el.dataset.t;S.rid=null;render()}
  else if(el=g("[data-c]")){S.cat=el.dataset.c;render()}
  else if(el=g("[data-r]")){S.rid=+el.dataset.r;render();scrollTo(0,0)}
  else if(g("[data-back]")){S.rid=null;render()}
  else if(el=g("[data-add]")){addItem(el.dataset.add)}
  else if(g("#cartbtn")||g("#fab")){openCart()}
  else if(g("[data-close]")||e.target.id==="drawer"){$("drawer").classList.remove("on")}
  else if(el=g("[data-q]")){const k=el.dataset.q,c=S.cart[k];c.q+=+el.dataset.d;if(c.q<=0)delete S.cart[k];if(!Object.keys(S.cart).length)S.cartRest=null;save();render();openCart()}
  else if(g("#place")){placeOrder()}
  else if(g("#lang")){L=L==="bn"?"en":"bn";try{localStorage.setItem("lang",L)}catch(x){}render()}
});
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
render();load();
</script>
</body>
</html>
