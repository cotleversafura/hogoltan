<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>তাজা বাজার | Taja Bazar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F6F1;--card:#fff;--ink:#17231D;--mute:#5E6F65;--g:#1F4D3A;--g2:#2E6B50;--y:#E8A317;--line:#D9E2DA;--err:#C0392B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A15;--card:#17241D;--ink:#EAF1EC;--mute:#9BAEA2;--g:#5FB88C;--g2:#4AA37A;--line:#26372D}}
:root[data-theme="dark"]{--bg:#101A15;--card:#17241D;--ink:#EAF1EC;--mute:#9BAEA2;--g:#5FB88C;--g2:#4AA37A;--line:#26372D}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;cursor:pointer}
.pill{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:20px;padding:4px 12px}
.cartbtn{background:var(--y);color:#17231D;border:0;border-radius:20px;padding:6px 14px;font-weight:700}
.hero{padding:22px 16px 8px;max-width:1000px;margin:auto}
.hero h2{font-size:26px;margin:0 0 4px}.hero p{margin:0;color:var(--mute)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:1000px;margin:auto}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px}
.tab[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:1000px;margin:auto;padding:0 16px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.p .e{font-size:40px;line-height:1.2}.p b{font-size:16px}.p small{color:var(--mute)}
.p .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.add{background:var(--g);color:#fff;border:0;border-radius:6px;padding:5px 12px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--card);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.25)}
#drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dh h3{margin:0}.body{flex:1;overflow:auto;padding:12px 16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 0}
label{display:block;font-size:14px;margin-top:10px}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.err{color:var(--err);font-size:13px;min-height:18px}
.order{width:100%;background:var(--y);color:#17231D;border:0;border-radius:8px;padding:12px;font-weight:700;margin-top:10px}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.ok{padding:24px 16px;text-align:center}.ok .big{font-size:48px}
</style>
</head>
<body>
<header>
<h1 id="shopname"></h1>
<button class="pill" id="lang" aria-label="Language"></button>
<button class="cartbtn" id="cartbtn"></button>
</header>
<section class="hero"><h2 id="h2"></h2><p id="sub"></p></section>
<nav class="tabs" id="tabs"></nav>
<main id="grid"></main>

<aside id="drawer" aria-label="Cart">
<div class="dh"><h3 id="ct"></h3><button class="pill" style="color:var(--ink);border-color:var(--line)" id="close"></button></div>
<div class="body" id="cbody"></div>
</aside>

<script>
// ===== Edit these =====
const sb=(typeof SUPABASE_URL!=="undefined"&&SUPABASE_URL)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
// ======================
let P=[
["veg","🍅","টমেটো","Tomato","১ কেজি","1 kg",80],["veg","🥔","আলু","Potato","১ কেজি","1 kg",45],
["veg","🧅","পেঁয়াজ","Onion","১ কেজি","1 kg",70],["veg","🥬","পালং শাক","Spinach","১ আঁটি","1 bunch",25],
["fruit","🍌","কলা","Banana","১ ডজন","1 dozen",70],["fruit","🍎","আপেল","Apple","১ কেজি","1 kg",260],
["fruit","🥭","আম","Mango","১ কেজি","1 kg",120],["fruit","🍋","লেবু","Lemon","৪ পিস","4 pcs",30],
["stap","🍚","মিনিকেট চাল","Miniket rice","৫ কেজি","5 kg",420],["stap","🫘","মসুর ডাল","Lentils","১ কেজি","1 kg",140],
["stap","🛢️","সয়াবিন তেল","Soybean oil","১ লিটার","1 L",185],["stap","🧂","লবণ","Salt","১ কেজি","1 kg",40],
["dairy","🥚","ডিম","Eggs","১ ডজন","1 dozen",150],["dairy","🥛","তরল দুধ","Fresh milk","১ লিটার","1 L",95],
["dairy","🧈","মাখন","Butter","২০০ গ্রাম","200 g",190],["dairy","🍞","পাউরুটি","Bread","১ প্যাকেট","1 pack",60]
].map((a,i)=>({id:i,c:a[0],e:a[1],bn:a[2],en:a[3],ubn:a[4],uen:a[5],price:a[6]}));
const T={
bn:{all:"সব",veg:"সবজি",fruit:"ফল",stap:"মুদি",dairy:"দুধ-ডিম",h2:"তাজা বাজার, ঘরে বসে",sub:"অর্ডার করুন, দরজায় নগদ টাকায় নিন (ক্যাশ অন ডেলিভারি)।",add:"যোগ করুন",cart:"কার্ট",close:"বন্ধ",empty:"কার্ট খালি। পণ্য যোগ করুন।",sum:"পণ্যের দাম",del:"ডেলিভারি চার্জ",total:"সর্বমোট",name:"আপনার নাম",phone:"মোবাইল নম্বর",addr:"ডেলিভারি ঠিকানা",memo:"অতিরিক্ত নির্দেশনা (ঐচ্ছিক)",place:"অর্ডার কনফার্ম করুন",cod:"পেমেন্ট: ডেলিভারির সময় নগদ টাকা।",eName:"নাম লিখুন",ePhone:"সঠিক মোবাইল নম্বর দিন (০১XXXXXXXXX)",eAddr:"ঠিকানা লিখুন",thanks:"অর্ডার হয়েছে!",thx2:"অর্ডার নম্বর",wa:"WhatsApp-এ দোকানে পাঠান",wan:"নিচের বোতামে চাপ দিয়ে অর্ডারটি দোকানে পাঠান, তাহলেই দোকান কনফার্ম করবে।",again:"আবার কিনুন"},
en:{all:"All",veg:"Vegetables",fruit:"Fruits",stap:"Staples",dairy:"Dairy & eggs",h2:"Fresh groceries, delivered",sub:"Order online and pay cash when it arrives at your door.",add:"Add",cart:"Cart",close:"Close",empty:"Your cart is empty. Add some items.",sum:"Items",del:"Delivery charge",total:"Total",name:"Your name",phone:"Mobile number",addr:"Delivery address",memo:"Extra instructions (optional)",place:"Confirm order",cod:"Payment: cash on delivery.",eName:"Enter your name",ePhone:"Enter a valid mobile number (01XXXXXXXXX)",eAddr:"Enter your address",thanks:"Order placed!",thx2:"Order number",wa:"Send to shop on WhatsApp",wan:"Tap the button below to send your order to the shop so they can confirm it.",again:"Shop again"}
};
let lang="bn",cat="all",cart={},done=null;
try{lang=localStorage.getItem("lang")||"bn";cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id),t=k=>T[lang][k];
const fmt=n=>"৳"+(lang==="bn"?n.toLocaleString("bn-BD"):n.toLocaleString("en-US"));
const num=n=>lang==="bn"?n.toLocaleString("bn-BD"):String(n);
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart));localStorage.setItem("lang",lang)}catch(e){}};
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>Object.entries(cart).reduce((s,[id,q])=>s+P[id].price*q,0);
function setQ(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();render()}
function render(){
document.documentElement.lang=lang;document.title=SHOP[lang];
$("shopname").textContent="🛒 "+SHOP[lang];$("lang").textContent=lang==="bn"?"English":"বাংলা";
$("h2").textContent=t("h2");$("sub").textContent=t("sub");
$("cartbtn").textContent=t("cart")+" ("+num(count())+")";$("close").textContent=t("close");$("ct").textContent=t("cart");
$("tabs").innerHTML=["all","veg","fruit","stap","dairy"].map(k=>`<button class="tab" aria-pressed="${cat===k}" data-c="${k}">${t(k)}</button>`).join("");
$("grid").innerHTML=P.filter(p=>cat==="all"||p.c===cat).map(p=>{
const q=cart[p.id]||0;
return `<div class="p"><div class="e" aria-hidden="true">${p.e}</div><b>${p[lang]}</b><small>${lang==="bn"?p.ubn:p.uen}</small>
<div class="row"><span>${fmt(p.price)}</span>${q?`<span class="qty"><button data-d="-1" data-i="${p.id}" aria-label="-">−</button>${num(q)}<button data-d="1" data-i="${p.id}" aria-label="+">+</button></span>`:`<button class="add" data-d="1" data-i="${p.id}">${t("add")}</button>`}</div></div>`}).join("");
renderCart();
}
function renderCart(){
const b=$("cbody");
if(done){const d=done;b.innerHTML=`<div class="ok"><div class="big">✅</div><h3>${t("thanks")}</h3><p>${t("thx2")}: <b>${d.id}</b></p><p class="note">${t("wan")}</p>
<a href="${d.link}" target="_blank" rel="noopener"><button class="order">${t("wa")}</button></a>
<button class="tab" style="margin-top:12px" id="again">${t("again")}</button></div>`;$("again").onclick=()=>{done=null;$("drawer").classList.remove("open");render()};return}
if(!count()){b.innerHTML=`<p class="note">${t("empty")}</p>`;return}
const keep=["fn","fp","fa","fm"].map(i=>$(i)?$(i).value:"");
b.innerHTML=Object.entries(cart).map(([id,q])=>{const p=P[id];return `<div class="item"><div>${p.e} ${p[lang]}<br><small>${fmt(p.price)} × ${num(q)}</small></div><span class="qty"><button data-d="-1" data-i="${id}">−</button>${num(q)}<button data-d="1" data-i="${id}">+</button></span></div>`}).join("")+
`<div class="item"><span>${t("sum")}</span><span>${fmt(sub())}</span></div><div class="item"><span>${t("del")}</span><span>${fmt(DELIVERY)}</span></div>
<div class="tot"><span>${t("total")}</span><span>${fmt(sub()+DELIVERY)}</span></div>
<label for="fn">${t("name")}</label><input id="fn" autocomplete="name">
<label for="fp">${t("phone")}</label><input id="fp" inputmode="tel" autocomplete="tel">
<label for="fa">${t("addr")}</label><textarea id="fa" rows="2" autocomplete="street-address"></textarea>
<label for="fm">${t("memo")}</label><textarea id="fm" rows="2"></textarea>
<div class="err" id="err" role="alert"></div>
<button class="order" id="place">${t("place")}</button><p class="note">${t("cod")}</p>`;
["fn","fp","fa","fm"].forEach((i,n)=>$(i).value=keep[n]);
$("place").onclick=place;
}
async function place(){
const n=$("fn").value.trim(),ph=$("fp").value.trim().replace(/[\s-]/g,""),a=$("fa").value.trim(),m=$("fm").value.trim();
const bd=s=>s.replace(/[০-৯]/g,c=>"০১২৩৪৫৬৭৮৯".indexOf(c));
const phn=bd(ph);
let e="";if(!n)e=t("eName");else if(!/^(\+?88)?01[3-9]\d{8}$/.test(phn))e=t("ePhone");else if(!a)e=t("eAddr");
if(e){$("err").textContent=e;return}
const id="TB"+Date.now().toString().slice(-6);
const lines=Object.entries(cart).map(([i,q])=>`• ${P[i].bn} / ${P[i].en} × ${q} = ৳${P[i].price*q}`).join("\n");
const msg=`অর্ডার ${id}\n${lines}\nপণ্য: ৳${sub()}\nডেলিভারি: ৳${DELIVERY}\nমোট (ক্যাশ অন ডেলিভারি): ৳${sub()+DELIVERY}\n\nনাম: ${n}\nমোবাইল: ${phn}\nঠিকানা: ${a}${m?"\nনির্দেশনা: "+m:""}`;
if(sb){const btn=$("place");btn.disabled=true;
const items=Object.entries(cart).map(([i,q])=>({name_bn:P[i].bn,name_en:P[i].en,price:P[i].price,qty:q}));
const {error}=await sb.from("orders").insert({order_no:id,name:n,phone:phn,address:a,memo:m,items,subtotal:sub(),delivery:DELIVERY,total:sub()+DELIVERY});
btn.disabled=false;if(error){$("err").textContent=lang==="bn"?"অর্ডার পাঠানো যায়নি, আবার চেষ্টা করুন":"Could not place order, please try again";return}}
done={id,link:"https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg)};
cart={};save();render();
}
document.addEventListener("click",e=>{
const x=e.target.closest("[data-d]");if(x){setQ(+x.dataset.i,+x.dataset.d);return}
const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;render()}
});
$("lang").onclick=()=>{lang=lang==="bn"?"en":"bn";save();render()};
$("cartbtn").onclick=()=>{$("drawer").classList.add("open");renderCart()};
$("close").onclick=()=>$("drawer").classList.remove("open");
async function loadProducts(){
if(!sb)return;
const {data,error}=await sb.from("products").select("*").eq("in_stock",true).order("id");
if(error||!data||!data.length)return;
P=data.map((r,i)=>({id:i,c:r.category,e:r.emoji||"🛒",bn:r.name_bn,en:r.name_en||r.name_bn,ubn:r.unit_bn||"",uen:r.unit_en||r.unit_bn||"",price:Number(r.price)}));
Object.keys(cart).forEach(k=>{if(!P[k])delete cart[k]});save();render();
}
render();loadProducts();
</script>
</body>
</html>
